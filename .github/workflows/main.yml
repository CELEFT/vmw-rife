name: Remove Watermark + RIFE 20221029 (Sharded)

on:
  workflow_dispatch:
    inputs:
      region:
        description: '水印区域 x,y,w,h'
        required: true
        default: '1800,2052,2000,80'
      width:
        description: '视频宽度'
        required: true
        default: '3840'
      height:
        description: '视频高度'
        required: true
        default: '2160'
      fps:
        description: '原始帧率'
        required: true
        default: '30'
      ctx_frames:
        description: '上下文帧数（前后各多取）'
        required: true
        default: '10'

jobs:
  # ============================================
  # Stage 1: 去水印 (4 分片并行，按帧号精确提取)
  # ============================================
  remove_wm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            head_ctx: 0
            tail_ctx: 1
          - shard: 1
            head_ctx: 1
            tail_ctx: 1
          - shard: 2
            head_ctx: 1
            tail_ctx: 1
          - shard: 3
            head_ctx: 1
            tail_ctx: 0
    steps:
      - uses: actions/checkout@v4

      - name: Download input video from Release
        run: |
          wget -q -O input.mp4 \
            https://github.com/CELEFT/vmw-rife/releases/download/video/input.mp4
          ls -lh input.mp4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache LaMa model
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: simple-lama-model-v1

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install simple-lama-inpainting opencv-python-headless pillow numpy

      - name: Compute shard frame range
        id: t
        run: |
          CTX=${{ github.event.inputs.ctx_frames }}
          SHARD=${{ matrix.shard }}
          HEAD=${{ matrix.head_ctx }}
          TAIL=${{ matrix.tail_ctx }}

          TOTAL_FRAMES=$(ffprobe -v error -select_streams v:0 -count_frames \
            -show_entries stream=nb_read_frames -of csv=p=0 input.mp4)
          echo "Total frames probed: $TOTAL_FRAMES"

          FRAMES_PER_SHARD=$(( (TOTAL_FRAMES + 3) / 4 ))

          CORE_START=$(( SHARD * FRAMES_PER_SHARD ))
          CORE_END=$(( CORE_START + FRAMES_PER_SHARD - 1 ))
          if [ $CORE_END -ge $TOTAL_FRAMES ]; then
            CORE_END=$(( TOTAL_FRAMES - 1 ))
          fi

          SEL_START=$(( CORE_START - HEAD * CTX ))
          SEL_END=$(( CORE_END + TAIL * CTX ))
          if [ $SEL_START -lt 0 ]; then SEL_START=0; fi

          echo "core_start=$CORE_START" >> $GITHUB_OUTPUT
          echo "core_end=$CORE_END" >> $GITHUB_OUTPUT
          echo "sel_start=$SEL_START" >> $GITHUB_OUTPUT
          echo "sel_end=$SEL_END" >> $GITHUB_OUTPUT
          echo "Shard $SHARD: core=[$CORE_START,$CORE_END] sel=[$SEL_START,$SEL_END]"

      - name: Remove watermark (shard ${{ matrix.shard }})
        env:
          REGION: ${{ github.event.inputs.region }}
          W: ${{ github.event.inputs.width }}
          H: ${{ github.event.inputs.height }}
          FPS: ${{ github.event.inputs.fps }}
        run: |
          set -o pipefail
          SEL_START=${{ steps.t.outputs.sel_start }}
          SEL_END=${{ steps.t.outputs.sel_end }}
          echo "Processing shard ${{ matrix.shard }}: frames [$SEL_START, $SEL_END]"

          ffmpeg -i input.mp4 \
            -vf "select='between(n,$SEL_START,$SEL_END)'" \
            -fps_mode passthrough \
            -f rawvideo -pix_fmt bgr24 - \
            | python scripts/process.py \
            | ffmpeg -y \
                -f rawvideo -pix_fmt bgr24 -s ${W}x${H} -r ${FPS} -i - \
                -c:v libaom-av1 -crf 0 -cpu-used 8 -row-mt 1 -threads 2 \
                -pix_fmt yuv444p10le \
                -an wm_shard_${{ matrix.shard }}.mkv

          ls -lh wm_shard_${{ matrix.shard }}.mkv

      - name: Upload wm shard
        uses: actions/upload-artifact@v4
        with:
          name: wm-shard-${{ matrix.shard }}
          path: wm_shard_${{ matrix.shard }}.mkv
          retention-days: 7

  # ============================================
  # Stage 2: RIFE 20221029 补帧 (4 分片并行，PNG 无损)
  # ============================================
  interpolate:
    needs: remove_wm
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            head_ctx: 0
            tail_ctx: 1
          - shard: 1
            head_ctx: 1
            tail_ctx: 1
          - shard: 2
            head_ctx: 1
            tail_ctx: 1
          - shard: 3
            head_ctx: 1
            tail_ctx: 0
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Vulkan + FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget unzip \
            libvulkan1 mesa-vulkan-drivers vulkan-tools

      - name: Verify Vulkan availability
        run: |
          vulkaninfo --summary 2>&1 | head -40 || echo "Vulkan info failed (fallback to CPU)"

      - name: Install rife-ncnn-vulkan 20221029
        run: |
          wget -q https://github.com/nihui/rife-ncnn-vulkan/releases/download/20221029/rife-ncnn-vulkan-20221029-ubuntu.zip
          unzip -q rife-ncnn-vulkan-20221029-ubuntu.zip
          chmod +x rife-ncnn-vulkan-20221029-ubuntu/rife-ncnn-vulkan
          ls -R rife-ncnn-vulkan-20221029-ubuntu | head -60

      - name: Verify RIFE model exists
        run: |
          MODEL_DIR="rife-ncnn-vulkan-20221029-ubuntu/rife-v4.6"
          if [ ! -d "$MODEL_DIR" ]; then
            MODEL_DIR=$(find rife-ncnn-vulkan-20221029-ubuntu -maxdepth 1 -type d -name "rife-v*" | head -1)
          fi
          if [ -z "$MODEL_DIR" ] || [ ! -d "$MODEL_DIR" ]; then
            echo "ERROR: no RIFE model dir"; ls -R rife-ncnn-vulkan-20221029-ubuntu; exit 1
          fi
          echo "RIFE_MODEL_DIR=$MODEL_DIR" >> $GITHUB_ENV

      - name: Download wm shard
        uses: actions/download-artifact@v4
        with:
          name: wm-shard-${{ matrix.shard }}

      - name: Extract frames as PNG (lossless)
        run: |
          mkdir -p frames_in
          ffmpeg -i wm_shard_${{ matrix.shard }}.mkv -pix_fmt rgb24 frames_in/%06d.png
          echo "Extracted: $(ls frames_in | wc -l)"
          du -sh frames_in

      - name: RIFE interpolation 2x (PNG)
        run: |
          mkdir -p frames_out
          ./rife-ncnn-vulkan-20221029-ubuntu/rife-ncnn-vulkan \
            -i frames_in -o frames_out \
            -m "$RIFE_MODEL_DIR" -j 2:2:2 -f "%06d.png"
          echo "RIFE out: $(ls frames_out | wc -l)"
          du -sh frames_out

      - name: Trim context and rebuild 60fps AV1 lossless
        env:
          CTX_FRAMES: ${{ github.event.inputs.ctx_frames }}
        run: |
          CTX=${{ github.event.inputs.ctx_frames }}
          HEAD_CTX=${{ matrix.head_ctx }}
          TAIL_CTX=${{ matrix.tail_ctx }}

          TOTAL_INTERP=$(ls frames_out/*.png | wc -l)
          HEAD_TRIM=$(( HEAD_CTX * 2 * CTX ))
          TAIL_TRIM=$(( TAIL_CTX * 2 * CTX ))
          START=$HEAD_TRIM
          END=$(( TOTAL_INTERP - TAIL_TRIM - 1 ))

          echo "TOTAL=$TOTAL_INTERP HEAD_TRIM=$HEAD_TRIM TAIL_TRIM=$TAIL_TRIM"
          echo "Keep [$START, $END] = $(( END - START + 1 )) frames"

          ffmpeg -y -framerate 60 -i frames_out/%06d.png \
            -vf "select='between(n,$START,$END)',setpts=N/FRAME_RATE/TB" \
            -c:v libaom-av1 -crf 0 -cpu-used 8 -row-mt 1 -threads 2 \
            -pix_fmt yuv444p10le \
            -an interp_shard_${{ matrix.shard }}.mkv

          ls -lh interp_shard_${{ matrix.shard }}.mkv

      - name: Upload interp shard
        uses: actions/upload-artifact@v4
        with:
          name: interp-shard-${{ matrix.shard }}
          path: interp_shard_${{ matrix.shard }}.mkv
          retention-days: 7

  # ============================================
  # Stage 3: 合并 + 音轨还原
  # ============================================
  merge:
    needs: interpolate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download input video from Release
        run: |
          wget -q -O input.mp4 \
            https://github.com/CELEFT/vmw-rife/releases/download/video/input.mp4

      - name: Download all interp shards
        uses: actions/download-artifact@v4
        with:
          path: shards

      - name: Install ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Concat + restore audio (final MKV)
        run: |
          > list.txt
          for i in 0 1 2 3; do
            echo "file 'shards/interp-shard-$i/interp_shard_$i.mkv'" >> list.txt
          done
          cat list.txt

          ffmpeg -y -f concat -safe 0 -i list.txt -c copy merged_60fps.mkv

          ffmpeg -y -i merged_60fps.mkv -i input.mp4 \
            -map 0:v -map 1:a? \
            -c:v copy -c:a copy \
            -map_metadata -1 \
            output_60fps.mkv

          ls -lh output_60fps.mkv
          echo "=== Final video info ==="
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,nb_frames,duration,pix_fmt \
            -of default=noprint_wrappers=1 output_60fps.mkv

      - name: Upload final
        uses: actions/upload-artifact@v4
        with:
          name: output-video-60fps
          path: output_60fps.mkv
          retention-days: 7
