name: Remove Watermark (ROI + ProPainter 4-Jobs)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: '输入视频 URL（直链）'
        required: true
        default: 'https://github.com/CELEFT/vmw-rife/releases/download/video/input.mp4'
      region:
        description: '水印区域 x,y,w,h (基于原视频分辨率)'
        required: true
        default: '3300,1800,600,400'
      width:
        description: '视频宽度'
        required: true
        default: '3840'
      height:
        description: '视频高度'
        required: true
        default: '2160'
      fps:
        description: '原始帧率'
        required: true
        default: '30'
      enable_interpolation:
        description: '是否启用 RIFE 补帧 (30→60fps)'
        required: true
        type: choice
        options:
          - 'yes'
          - 'no'
        default: 'no'

jobs:
  # ============================================
  # Prepare: 下载视频、截取ROI、生成动态Mask
  # ============================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      num_shards: 4
    steps:
      - uses: actions/checkout@v4

      - name: Download input video
        run: |
          wget -q -O input.mp4 "${{ github.event.inputs.video_url }}"
          ls -lh input.mp4

      - name: Install ffmpeg & OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-opencv python3-numpy

      - name: Crop ROI video
        run: |
          REGION="${{ github.event.inputs.region }}"
          IFS=',' read X Y W H <<< "$REGION"
          echo "Cropping ROI: x=$X, y=$Y, w=$W, h=$H"
          ffmpeg -y -i input.mp4 -vf "crop=${W}:${H}:${X}:${Y}" -an -c:v libx264 -crf 10 -preset veryfast -pix_fmt yuv420p roi.mp4
          ls -lh roi.mp4

      - name: Generate Dynamic Mask
        run: |
          python3 scripts/detect_watermark.py \
            --video roi.mp4 \
            --output dynamic_mask.mp4 \
            --total_frames $(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 input.mp4) \
            --fps ${{ github.event.inputs.fps }}

      - uses: actions/upload-artifact@v4
        with:
          name: input-assets
          path: |
            input.mp4
            roi.mp4
            dynamic_mask.mp4

  # ============================================
  # Process: 4路并行 ProPainter 修复 ROI 视频
  # ============================================
  process:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: input-assets
          path: .

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ffmpeg & Python deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install opencv-python-headless numpy

      - name: Clone ProPainter
        run: git clone https://github.com/sczhou/ProPainter.git

      - name: Cache ProPainter Models
        uses: actions/cache@v4
        with:
          path: ProPainter/weights
          key: propainter-weights-v1

      - name: Download ProPainter models
        run: |
          cd ProPainter
          # 兼容官方权重下载脚本
          if [ -f download_models.py ]; then python download_models.py; fi
          if [ -f scripts/download_models.py ]; then python scripts/download_models.py; fi
          # 手动下载兜底
          if [ ! -d "weights" ] || [ -z "$(ls -A weights 2>/dev/null)" ]; then
            echo "Creating weights directory..."
            mkdir -p weights
            wget -q https://github.com/sczhou/ProPainter/releases/download/v0.1.0/ProPainter.pth -P weights/
            wget -q https://github.com/sczhou/ProPainter/releases/download/v0.1.0/raft-things.pth -P weights/
            wget -q https://github.com/sczhou/ProPainter/releases/download/v0.1.0/recurrent_flow_completion.pth -P weights/
          fi

      - name: Process part ${{ matrix.part }}
        env:
          INPUT_VIDEO: roi.mp4
          INPUT_MASK: dynamic_mask.mp4
          TOTAL_FRAMES: 596  # 实际总帧数，如你所述
          CORE_PER_PART: 149
          OVERLAP: 30
          FPS: ${{ github.event.inputs.fps }}
        run: |
          chmod +x scripts/process_part.sh
          bash scripts/process_part.sh ${{ matrix.part }}

      - name: Upload processed part
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.part }}
          path: part_${{ matrix.part }}.mp4

  # ============================================
  # Merge: 拼接分片 -> 贴回原4K -> 补帧 -> 合并音频
  # ============================================
  merge:
    needs: [prepare, process]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Download input assets
        uses: actions/download-artifact@v4
        with:
          name: input-assets
          path: .

      - name: Download all processed parts
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts

      - name: Install ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Merge and Overlay
        run: |
          chmod +x scripts/merge.sh
          bash scripts/merge.sh

      - name: Interpolate (RIFE) - Optional
        if: github.event.inputs.enable_interpolation == 'yes'
        run: |
          echo "RIFE补帧暂未集成，如需请参考原版逻辑对全帧视频补帧。"
          # 建议：若需补帧，请对整个 output.mp4 执行，避免 ROI 帧率与全帧不匹配

      - name: Upload final
        uses: actions/upload-artifact@v4
        with:
          name: output-video
          path: output.mp4
          retention-days: 7
